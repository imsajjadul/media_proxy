<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BDIX Hub</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-hover: #1f1f1f;
    --border: #2a2a2a;
    --text: #e5e5e5;
    --text-muted: #888;
    --accent: #e50914;
    --accent-hover: #f40612;
    --folder: #f5c518;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
    padding-bottom: 80px;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    position: sticky;
    top: 0;
    background: rgba(10,10,10,0.9);
    backdrop-filter: blur(10px);
    padding: 12px 0;
    z-index: 10;
  }
  .topbar h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg,#fff,#aaa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .search-wrap { flex:1; position: relative; max-width: 420px; }
  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px 10px 36px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .search-wrap input:focus { border-color: #555; }
  .search-wrap::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    opacity: .6;
  }
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .breadcrumb span { cursor: pointer; transition: color .2s; }
  .breadcrumb span:hover { color: #fff; text-decoration: underline; }
  .breadcrumb .sep { opacity: .4; cursor: default; pointer-events: none; }

  /* Detail hero */
  .hero {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    gap: 20px;
    align-items: flex-start;
  }
  .hero.active { display: flex; }
  .hero .poster {
    width: 130px;
    min-width: 130px;
    aspect-ratio: 2/3;
    background: #222;
    border-radius: 12px;
    overflow: hidden;
    display: grid;
    place-items: center;
    font-size: 48px;
    color: #444;
    border: 1px solid var(--border);
  }
  .hero .poster img { width:100%; height:100%; object-fit:cover; display:block; }
  .hero .info { flex:1; min-width:0; }
  .hero h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; line-height:1.2; }
  .hero .meta-line { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .hero .year { color: var(--text-muted); font-size: 14px; }
  .hero .rating { color: #ffc107; font-size: 14px; font-weight: 600; }
  .hero .plot { color: #aaa; font-size: 14px; line-height: 1.6; margin-bottom: 18px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .hero .actions { display:flex; gap:10px; flex-wrap:wrap; }
  .btn {
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-ghost:hover { background: rgba(255,255,255,0.15); }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 14px;
  }
  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
  .card {
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
    border: 1px solid var(--border);
    position: relative;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); border-color: #3a3a3a; }
  .card .thumb {
    width: 100%;
    aspect-ratio: 2/3;
    background: #1c1c1c;
    display: grid;
    place-items: center;
    font-size: 40px;
    color: #3a3a3a;
    position: relative;
  }
  .card.folder .thumb { aspect-ratio: 1; font-size: 32px; color: var(--folder); background: #1a170d; }
  .card .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .card .badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(0,0,0,0.7);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    color: #fff;
    backdrop-filter: blur(4px);
  }
  .card .info { padding: 10px 10px 12px; }
  .card .title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { font-size: 11px; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 4px; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; opacity: .3; }

  /* Loading skeleton */
  .skeleton {
    background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #333;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: all .3s;
    z-index: 100;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <h1>BDIX Hub</h1>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search across all servers..." autocomplete="off">
  </div>
</div>

<div class="breadcrumb" id="crumb"></div>

<div class="hero" id="hero">
  <div class="poster" id="hero-poster">🎬</div>
  <div class="info">
    <h2 id="hero-title">Title</h2>
    <div class="meta-line">
      <span class="year" id="hero-year"></span>
      <span class="rating" id="hero-rating"></span>
    </div>
    <div class="plot" id="hero-plot"></div>
    <div class="actions">
      <button class="btn btn-primary" onclick="playCurrent()">▶ Play</button>
      <button class="btn btn-ghost" onclick="copyLink()">🔗 Copy Link</button>
    </div>
  </div>
</div>

<div class="grid" id="grid">
  <div class="empty"><div class="icon">⏳</div>Loading sources...</div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let currentPath = '';
let currentVideo = null;
let currentMeta = {};

/* ── Utilities ── */
const esc = t => { const d=document.createElement('div'); d.textContent=t||''; return d.innerHTML; };
const escJs = t => (t||'').replace(/\/g,'\\').replace(/'/g,"\'").replace(/"/g,'\"');
const isVideo = n => /\.(mkv|mp4|avi|mov|wmv|flv|webm|ts|m4v|m2ts|mpg|mpeg)$/i.test(n);
const isSub = n => /\.(srt|ass|ssa|vtt|sub|idx)$/i.test(n);
const fmtSize = s => {
  if(!s || s==='-') return '';
  const n = parseFloat(s);
  if(isNaN(n)) return s;
  if(n>1e12) return (n/1e12).toFixed(1)+' TB';
  if(n>1e9) return (n/1e9).toFixed(1)+' GB';
  if(n>1e6) return (n/1e6).toFixed(1)+' MB';
  if(n>1e3) return (n/1e3).toFixed(1)+' KB';
  return n+' B';
};
const parseMovie = name => {
  const m = name.match(/^(.+?)\s*\((\d{4})\)$/);
  return m ? {title: m[1].trim(), year: m[2]} : null;
};

/* ── Navigation ── */
async function loadSources() {
  setGridSkeleton();
  try {
    const res = await fetch('/api/sources');
    const sources = await res.json();
    renderGrid(sources.map(s => ({
      name: s.name,
      is_dir: true,
      is_source: true,
      size: ''
    })));
    setCrumb([{name:'Home', path:''}]);
  } catch(e) { toast('Failed to load sources'); }
}

async function browse(path) {
  currentPath = path;
  currentVideo = null;
  $('hero').classList.remove('active');
  if (!path) { loadSources(); return; }

  setGridSkeleton();
  try {
    const res = await fetch('/api/browse?path=' + encodeURIComponent(path));
    const data = await res.json();

    const videos = data.entries.filter(e => !e.is_dir && isVideo(e.name));
    const subs   = data.entries.filter(e => !e.is_dir && isSub(e.name));
    const folders = data.entries.filter(e => e.is_dir);
    const others = data.entries.filter(e => !e.is_dir && !isVideo(e.name) && !isSub(e.name));

    // If we entered a movie folder (single video, no sub-folders), show detail view
    if (videos.length >= 1 && folders.length === 0 && path.split('/').length > 1) {
      showDetail(path, videos[0], subs);
    } else {
      renderGrid([...folders, ...videos, ...others]);
    }
    updateCrumb(path);
  } catch(e) { toast('Failed to browse'); }
}

function setGridSkeleton() {
  $('grid').innerHTML = Array(8).fill(0).map(()=>`
    <div class="card"><div class="thumb skeleton"></div><div class="info"><div class="title skeleton" style="height:14px;width:80%;"></div></div></div>
  `).join('');
}

function renderGrid(entries) {
  if (!entries.length) {
    $('grid').innerHTML = `<div class="empty"><div class="icon">📂</div>Nothing here</div>`;
    return;
  }
  $('grid').innerHTML = entries.map(e => {
    const movieMeta = parseMovie(e.name);
    const isMovieFolder = e.is_dir && movieMeta;
    const icon = e.is_dir ? (isMovieFolder ? '🎬' : '📁') : (isVideo(e.name) ? '🎬' : '📄');
    const thumb = e.poster
      ? `<img src="https://image.tmdb.org/t/p/w300${e.poster}" loading="lazy" onerror="this.parentNode.textContent='${icon}';this.style.display='none'">`
      : icon;
    const badge = !e.is_dir && e.size ? `<span class="badge">${fmtSize(e.size)}</span>` : '';
    const sub = e.is_dir ? (e.is_source ? 'Source' : 'Folder') : (fmtSize(e.size) || 'File');
    return `
      <div class="card ${e.is_dir?'folder':''}" onclick="onCardClick('${escJs(e.name)}',${e.is_dir},'${escJs(currentPath)}')">
        <div class="thumb">${thumb}${badge}</div>
        <div class="info">
          <div class="title">${esc(e.name)}</div>
          <div class="sub">${esc(sub)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function onCardClick(name, isDir, parentPath) {
  const sep = parentPath.endsWith('/') ? '' : '/';
  const path = parentPath + sep + name;
  if (isDir) browse(path);
  else if (isVideo(name)) openPlayer(path, name);
}

/* ── Detail / Hero View ── */
async function showDetail(path, video, subs) {
  currentVideo = video;
  const folderName = path.split('/').filter(Boolean).pop() || '';
  const parsed = parseMovie(folderName);
  const title = parsed ? parsed.title : folderName;
  const year = parsed ? parsed.year : null;

  // Try TMDB
  let meta = {title, year, poster_path:null, overview:'', vote_average:null};
  try {
    const res = await fetch(`/api/meta?title=${encodeURIComponent(title)}&year=${year||''}`);
    if (res.ok) meta = await res.json();
  } catch(e){}
  currentMeta = meta;

  $('hero-title').textContent = meta.title || title;
  $('hero-year').textContent = meta.year || year || '';
  $('hero-rating').textContent = meta.vote_average ? `★ ${meta.vote_average.toFixed(1)}` : '';
  $('hero-plot').textContent = meta.overview || '';

  const posterEl = $('hero-poster');
  if (meta.poster_path) {
    posterEl.innerHTML = `<img src="https://image.tmdb.org/t/p/w300${meta.poster_path}" onerror="this.style.display='none';this.parentNode.textContent='🎬'">`;
  } else {
    posterEl.textContent = '🎬';
  }

  $('hero').classList.add('active');
  $('grid').innerHTML = '';

  // If there are multiple videos in the folder, list them below
  // (handled by caller, but we could add a "More files" section here)
}

/* ── Playback ── */
async function openPlayer(path, name) {
  try {
    const res = await fetch('/api/resolve?path=' + encodeURIComponent(path));
    const data = await res.json();
    const url = data.direct_url || data.proxy_url;
    if (!url) { toast('Could not resolve stream'); return; }

    // Try mpvRX intent first
    const intent = `intent://play?url=${encodeURIComponent(url)}#Intent;package=com.ritesh.mpvrx;action=android.intent.action.VIEW;type=video/*;end`;
    window.location = intent;

    // Fallback: if still on page after 1.5s, offer copy
    setTimeout(() => {
      if (document.visibilityState === 'visible') {
        toast('If mpvRX did not open, use Copy Link');
      }
    }, 1500);
  } catch(e) { toast('Failed to resolve'); }
}

function playCurrent() {
  if (currentVideo) openPlayer(currentPath + '/' + currentVideo.name, currentVideo.name);
  else toast('No video selected');
}

async function copyLink() {
  if (!currentVideo) return;
  try {
    const res = await fetch('/api/resolve?path=' + encodeURIComponent(currentPath + '/' + currentVideo.name));
    const data = await res.json();
    const url = data.direct_url || data.proxy_url;
    await navigator.clipboard.writeText(url);
    toast('Link copied!');
  } catch(e) { toast('Copy failed'); }
}

/* ── Search ── */
let searchDebounce;
$('search').addEventListener('input', e => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim();
  if (!q) { browse(currentPath); return; }
  searchDebounce = setTimeout(() => doSearch(q), 350);
});

async function doSearch(q) {
  setGridSkeleton();
  $('hero').classList.remove('active');
  try {
    const res = await fetch('/api/search?q=' + encodeURIComponent(q));
    const data = await res.json();
    const results = (data.results || []).map(r => ({
      name: r.name,
      is_dir: r.is_dir,
      size: '',
      is_source: false
    }));
    renderGrid(results);
    setCrumb([{name:'Home', path:''}, {name:`Search: "${q}"`, path:''}]);
  } catch(e) { toast('Search failed'); }
}

/* ── Breadcrumb ── */
function updateCrumb(path) {
  const parts = path.split('/').filter(Boolean);
  const crumbs = [{name:'Home', path:''}];
  let build = '';
  for (const p of parts) { build += '/' + p; crumbs.push({name: p, path: build}); }
  setCrumb(crumbs);
}
function setCrumb(crumbs) {
  $('crumb').innerHTML = crumbs.map((c,i) =>
    `<span onclick="browse('${escJs(c.path)}')">${esc(c.name)}</span>` +
    (i < crumbs.length-1 ? '<span class="sep">/</span>' : '')
  ).join('');
}

/* ── Toast ── */
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* ── Init ── */
loadSources();
</script>
</body>
</html>
